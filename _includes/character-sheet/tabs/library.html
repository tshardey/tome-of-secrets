<!-- TAB 5: LIBRARY -->
<div class="tab-panel" data-tab-panel="library" role="tabpanel">
<div class="rpg-tab-content">
    <!-- Plan 4 (D9): the one-time review of Unsorted books; LibraryTidyController fills it -->
    <div class="rpg-panel rpg-library-tidy-panel" id="library-tidy-panel" hidden>
        <div class="rpg-panel-header">
            <h2 class="rpg-panel-title">🧹 Tidy your ToS library</h2>
        </div>
        <div class="rpg-panel-body">
            <div id="library-tidy-body" class="library-tidy-body"></div>
            <div id="library-tidy-message" class="library-tidy-message" role="status" aria-live="polite"></div>
        </div>
    </div>

    <div class="rpg-panel rpg-library-add-panel">
        <div class="rpg-panel-header">
            <h2 class="rpg-panel-title">📚 Add a Book</h2>
            <button type="button"
                    class="panel-toggle-btn"
                    data-panel-target="library-add-panel-body"
                    aria-expanded="true"
                    aria-controls="library-add-panel-body">
                Hide
            </button>
        </div>
        <div class="rpg-panel-body" id="library-add-panel-body">
            <div id="library-add-book-form" class="library-add-form" role="form" aria-label="Add a book">
                <div class="form-row library-type-row">
                    <label id="library-add-type-label"><strong>What kind of book is it?</strong></label>
                    <div class="library-type-radios" role="radiogroup" aria-labelledby="library-add-type-label">
                        <label class="library-type-option"><input type="radio" name="library-add-type" value="audiobook" /> Audiobook</label>
                        <label class="library-type-option"><input type="radio" name="library-add-type" value="ebook" /> Ebook</label>
                        <label class="library-type-option"><input type="radio" name="library-add-type" value="library-loan" /> Library book</label>
                        <label class="library-type-option"><input type="radio" name="library-add-type" value="physical" /> Physical, not in the library yet</label>
                    </div>
                </div>
                <div class="form-row library-book-search-row">
                    <label for="library-book-title"><strong>Title:</strong></label>
                    <div class="library-search-input-and-results">
                        <div class="library-search-wrap">
                            <input type="text" id="library-book-title" class="library-title-input" placeholder="Search or enter title" autocomplete="off" />
                            <button type="button" id="library-book-search-btn" class="rpg-btn rpg-btn-secondary lookup-book-btn" title="Search for cover and details">Look up</button>
                        </div>
                        <div id="library-book-search-results" class="book-search-results library-search-results" aria-live="polite" style="display: none;"></div>
                    </div>
                </div>
                <div class="form-row">
                    <label for="library-book-author"><strong>Author (optional):</strong></label>
                    <input type="text" id="library-book-author" class="library-author-input" placeholder="Author" />
                </div>
                <div class="form-row library-cover-row">
                    <label><strong>Cover:</strong></label>
                    <div class="library-cover-fields">
                        <div class="library-cover-preview-wrap">
                            <img id="library-add-cover-preview" class="library-cover-preview" src="" alt="" role="presentation" style="display: none;">
                            <span id="library-add-cover-placeholder" class="library-cover-placeholder">No cover</span>
                        </div>
                        <div class="library-cover-inputs">
                            <input type="url" id="library-add-cover-url" class="library-cover-url-input" placeholder="Cover image URL" value="" />
                            <label for="library-add-cover-upload" class="library-cover-upload-label">Upload</label>
                            <input type="file" id="library-add-cover-upload" class="library-cover-upload-input" accept="image/*" />
                            <input type="hidden" id="library-add-cover-value" value="" />
                        </div>
                    </div>
                </div>
                <div class="form-row">
                    <label for="library-add-page-count"><strong>Page count (optional):</strong></label>
                    <input type="number" id="library-add-page-count" class="library-page-count-input" min="1" placeholder="—" value="" />
                </div>
                <div class="form-row library-tags-row">
                    <label>
                        <strong>Tags (optional):</strong>
                        <button type="button" class="library-tag-info-btn rpg-panel-help-icon-btn" aria-label="What are tags?" title="Tags determine which equipped items grant bonuses when you complete a book.">i</button>
                    </label>
                    <div id="library-add-tags" class="library-tag-picker" role="group" aria-label="Book tags">
                        <!-- Tags are rendered by LibraryController from bookTags.json -->
                    </div>
                </div>
                <div class="form-row library-add-actions">
                    <button type="button" id="library-add-book-btn" class="rpg-btn rpg-btn-primary" disabled>Add Book</button>
                </div>
            </div>
        </div>
    </div>

    <div class="rpg-panel rpg-library-books-panel">
        <div class="rpg-panel-header">
            <h2 class="rpg-panel-title">Your Library</h2>
        </div>
        <div class="rpg-panel-body">
            <div id="library-books-unsorted" class="library-books-section" style="display: none;">
                <h3 class="library-section-title">Unsorted</h3>
                <p class="library-section-note">Sort these in Tidy your ToS library above, or set a type from each book's ✏ button.</p>
                <div id="library-cards-unsorted" class="library-cards-grid"></div>
            </div>
            <div id="library-books-audiobook" class="library-books-section">
                <h3 class="library-section-title">Audiobooks</h3>
                <div id="library-cards-audiobook" class="library-cards-grid"></div>
            </div>
            <div id="library-books-ebook" class="library-books-section">
                <h3 class="library-section-title">Ebooks</h3>
                <div id="library-cards-ebook" class="library-cards-grid"></div>
            </div>
            <div id="library-books-library-loan" class="library-books-section">
                <h3 class="library-section-title">Library books</h3>
                <div id="library-cards-library-loan" class="library-cards-grid"></div>
            </div>
            <div id="library-books-physical" class="library-books-section" style="display: none;">
                <h3 class="library-section-title">Not in the library yet</h3>
                <div id="library-cards-physical" class="library-cards-grid"></div>
            </div>
        </div>
    </div>
</div>
</div>
<!-- END TAB 5: LIBRARY -->
